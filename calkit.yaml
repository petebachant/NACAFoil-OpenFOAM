name: nacafoil-openfoam
title: Simulating a NACA airfoil with OpenFOAM
description:
hub: localhost

dependencies:
  - docker
  - uv

environments:
  foam:
    kind: docker
    image: openfoam-2412-foampy
    user: root
    wdir: /work
    path: Dockerfile
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.12"

# Project-level parameters
parameters:
  angle_of_attack:
    - range:
        start: 0
        stop: 21
        step: 1

pipeline:
  stages:
    # Run OpenFOAM simulations for NACA 0012 at different angles of attack
    naca0012-re2e5:
      kind: python-script
      script_path: run.py
      environment: foam
      args:
        - "0012"
        - "{angle_of_attack}"
      iterate_over:
        - arg_name: angle_of_attack
          values:
            - parameter: angle_of_attack
      inputs:
        - system/controlDict
        - system/fvSchemes
        - system/fvSolution
        - system/createPatchDict
        - system/surfaces
        - constant/transportProperties
        - constant/turbulenceProperties
        - scripts/blockmeshdict.py
        - 0.org
      outputs:
        - cases/naca0012-re2e5-aoa-{angle_of_attack}
    # Aggregate results from all simulations into a single CSV file
    aggregate-results:
      kind: python-script
      script_path: scripts/aggregate.py
      environment: py
      inputs:
        - cases
      outputs:
        - path: processed/all-simulated.csv
          storage: git
    # Plot the lift-to-drag ratio against the experimental data from Ladson
    plot-clcd:
      kind: python-script
      script_path: scripts/plot-clcd.py
      environment: py
      inputs:
        - from_stage_outputs: aggregate-results
      outputs:
        - path: figures/naca0012-clcd.json
          storage: git
    # Plot flow fields for each angle of attack
    plot-flow:
      kind: python-script
      script_path: scripts/plot-flow.py
      environment: py
      args:
        - "{angle_of_attack}"
      iterate_over:
        - arg_name: angle_of_attack
          values:
            - parameter: angle_of_attack
      inputs:
        - cases/naca0012-re2e5-aoa-{angle_of_attack}/postProcessing/surfaces
      outputs:
        - figures/naca0012-re2e5-aoa-{angle_of_attack}-umag.png
        - figures/naca0012-re2e5-aoa-{angle_of_attack}-umag.html
    # Export the marimo notebook to a self-contained WebAssembly app.
    #
    # The stage assembles a build directory (marimo requires public/ to sit
    # next to the notebook, and we don't want it at the repo root), copies
    # each included path into public/ preserving its project-relative path,
    # then runs `marimo export html-wasm`.
    #
    # `include_paths` is deliberately explicit rather than reusing `inputs`:
    # publishing data to the web should be opt-in per path, not inferred.
    # Paths listed here are deps as well.
    #
    # Note that `marimo export html-wasm` only packages the notebook, it does
    # not execute it, and exits 0 even when every cell is broken. So the stage
    # should also run `marimo export html` from the build directory first,
    # which does execute and exits 1 on cell failure. Assembling public/
    # before validating means it runs against exactly the data we publish.
    build-app:
      kind: marimo
      notebook_path: notebook.py
      layout_path: layouts/notebook.grid.json
      environment: py
      # Export format, mirroring marimo's own export subcommands. `html`
      # executes the notebook and bakes the results into a single ~120 kB
      # file: static, but validated and free of runtime version drift.
      # `html-wasm` keeps it interactive at ~28 MB. `mode` applies only to
      # html-wasm; `show_code` only to `mode: run`.
      to: html-wasm
      mode: run
      show_code: true
      include_paths:
        - processed/all-simulated.csv
        - processed/NACA0012_6e6_Ladson_180grit.csv
        - figures/naca0012-re2e5-aoa-*-umag.png
      output_path: app
      app_storage: dvc

figures:
  - path: figures/naca0012-clcd.json
    title: NACA 0012 lift-to-drag ratio
    description: >
      Plotted against the Ladson 180 grit experimental data.
    stage: plot-clcd
  - path: figures/naca0012-re2e5-aoa-0-umag.png
    title: Velocity magnitude at 0 degrees angle of attack
    stage: plot-flow@0
  - path: figures/naca0012-re2e5-aoa-0-umag.html
    title: Velocity magnitude at 0 degrees angle of attack (interactive)
    stage: plot-flow@0

datasets:
  - path: processed/NACA0012_6e6_Ladson_80grit.csv
    imported_from:
      url: http://turbmodels.larc.nasa.gov/naca0012_val.html
  - path: processed/NACA0012_6e6_Ladson_120grit.csv
    imported_from:
      url: http://turbmodels.larc.nasa.gov/naca0012_val.html
  - path: processed/NACA0012_6e6_Ladson_180grit.csv
    imported_from:
      url: http://turbmodels.larc.nasa.gov/naca0012_val.html
  - path: processed/all-simulated.csv
    title: All simulation results
    stage: aggregate-results

# Apps are artifacts the Hub serves, not processes. Keyed by slug, since the
# key becomes a public URL segment and must survive a directory rename.
apps:
  naca0012:
    title: NACA 0012 explorer
    description: >
      Lift-to-drag ratio against the Ladson experimental data, with the
      velocity field at each simulated angle of attack.
    kind: static-html
    # The HTML file itself. Its containing folder is the serving root, and
    # index.html is implied when a folder is served.
    path: app/index.html
    stage: build-app

questions:
  - How well does a 2-D steady RANS simulation predict airfoil loading?

showcase:
  - markdown: >
      The figure below shows NACA 0012 lift-to-drag ratio plotted against
      the experimental data from Ladson.
      Note that the experimental data was collected at a much higher
      Reynolds number, which explains some of the discrepancy.
  - figure: figures/naca0012-clcd.json

releases:
  v2.0.0:
    kind: project
    path: .
    publisher: github
    url: https://github.com/petebachant/NACAFoil-OpenFOAM/releases/tag/v2.0.0
    date: "2025-02-11"
    title: v2.0.0
    description: "## What's Changed\r\n* Modernize and turn into a Calkit
      project by @petebachant in https://github.com/petebachant/NACAFoil-OpenFOAM/pull/34\r
      \n* Add marimo notebook and HF app by @petebachant in https://github.com/petebachant/NACAFoil-OpenFOAM/pull/35\r
      \n\r\n\r\n**Full Changelog**: https://github.com/petebachant/NACAFoil-OpenFOAM/compare/v1.0.0...v2.0.0"
  v1.0.0:
    kind: project
    path: .
    publisher: github
    url: https://github.com/petebachant/NACAFoil-OpenFOAM/releases/tag/v1.0.0
    date: "2025-01-08"
    title: v1.0.0
    description: "Compatible with OpenFOAM 3.0.x and Anaconda versions with
      Python 3.5.\r\n\r\n**Full Changelog**: https://github.com/petebachant/NACAFoil-OpenFOAM/commits/v1.0.0"
